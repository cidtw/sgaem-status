<!DOCTYPE html>
<html lang="ko-kr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGAEM 아카이브 상태 모니터</title>
  <meta name="description" content="163.239.88.115:3536 작동 여부 실시간 모니터">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient-glow"></div>

  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <div class="brand-badge" data-i18n="brandBadge">실시간 상태</div>
        <h1 data-i18n="pageTitle">163.239.88.115 상태</h1>
        <p class="target-link">
          <span data-i18n="targetLabel">대상:</span>
          <a href="http://163.239.88.115:3536/" target="_blank" rel="noopener"><code>http://163.239.88.115:3536/</code></a>
          <span class="host-pill">sgaemarchive.sogang.ac.kr</span>
        </p>
      </div>

      <div class="header-controls">
        <!-- Language Switcher -->
        <div class="control-group">
          <select id="langSelect" class="control-select" aria-label="Language selector">
            <option value="ko-kr" selected>🇰🇷 한국어</option>
            <option value="en">🇺🇸 English</option>
            <option value="cn">🇨🇳 中文</option>
          </select>
        </div>

        <!-- Theme Switcher (Dark / Light / System) -->
        <div class="theme-switcher" role="radiogroup" aria-label="Theme mode selector">
          <button class="theme-btn" data-theme-val="light" title="라이트 모드 (Light Mode)">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </button>
          <button class="theme-btn" data-theme-val="dark" title="다크 모드 (Dark Mode)">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
          <button class="theme-btn active" data-theme-val="system" title="시스템 테마 (System Mode)">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
          </button>
        </div>

        <!-- Interval Selector -->
        <div class="control-group refresh-control">
          <label for="intervalSelect" data-i18n="intervalLabel">주기:</label>
          <select id="intervalSelect" class="control-select">
            <option value="10">10s</option>
            <option value="30" selected>30s</option>
            <option value="60">60s</option>
            <option value="0" data-i18n="intervalManual">수동</option>
          </select>
        </div>

        <!-- Check Now Button -->
        <button id="refreshBtn" class="btn btn-primary" title="Trigger manual check">
          <svg class="spin-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
          </svg>
          <span id="btnText" data-i18n="checkNow">지금 확인</span>
        </button>
      </div>
    </header>

    <!-- Auto-refresh progress bar -->
    <div class="countdown-wrapper" id="countdownWrapper">
      <div class="countdown-bar" id="countdownBar"></div>
      <div class="countdown-label" id="countdownLabel">Next check in 30s</div>
    </div>

    <!-- Main Hero Banner: Working or Not -->
    <section class="hero-status card" id="heroCard">
      <div class="status-indicator-container">
        <div class="status-beacon" id="statusBeacon"></div>
        <div class="status-beacon-pulse" id="statusPulse"></div>
      </div>
      <div class="hero-content">
        <div class="hero-tag" id="statusTag" data-i18n="heroTagChecking">확인 중...</div>
        <h2 class="hero-title" id="statusTitle" data-i18n="heroInitialTitle">서버 상태 확인 중</h2>
        <p class="hero-desc" id="statusDesc" data-i18n="heroInitialDesc">163.239.88.115:3536 연결을 확인하고 있습니다...</p>
      </div>
      <div class="last-checked" id="lastCheckedText">마지막 확인: -</div>
    </section>

    <!-- Essential Metrics Cards -->
    <section class="metrics-grid">
      <div class="metric-card card">
        <div class="metric-label" data-i18n="metricServer">서버 작동 상태</div>
        <div class="metric-value" id="overallMetric">---</div>
        <div class="metric-sub" id="overallSub">163.239.88.115</div>
      </div>

      <div class="metric-card card">
        <div class="metric-label" data-i18n="metricTcp">TCP 3536 포트</div>
        <div class="metric-value" id="tcpMetric">---</div>
        <div class="metric-sub" id="tcpSub" data-i18n="metricTcpSub">소켓 연결</div>
      </div>

      <div class="metric-card card">
        <div class="metric-label" data-i18n="metricHttp">HTTP 응답</div>
        <div class="metric-value" id="httpMetric">---</div>
        <div class="metric-sub" id="httpSub" data-i18n="metricHttpWait">상태 코드</div>
      </div>

      <div class="metric-card card">
        <div class="metric-label" data-i18n="metricLatency">지연 시간</div>
        <div class="metric-value" id="latencyMetric">--- <span class="unit">ms</span></div>
        <div class="metric-sub" id="latencySub" data-i18n="metricLatencySub">왕복 응답 속도</div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <p data-i18n="footerText">SGAEM Archive Status Monitor</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
